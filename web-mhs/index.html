<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Web MicroHs</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-unicode11@0.6.0/lib/xterm-addon-unicode11.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.36.2/ace.js"></script>

  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: #1a1a1a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      background: #252526;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    #header h1 {
      margin: 0;
      font-size: 1.2rem;
      color: #ccc;
    }

    .button-row {
      display: flex;
      gap: 10px;
    }

    .button-row button {
      cursor: pointer;
      padding: 4px 10px;
    }

    /* The editor on the left, the output on the right */
    #workspace {
      display: flex;
      flex-grow: 1;
      width: 100vw;
      overflow: hidden;
    }

    #left-panel {
      flex: 0 0 50%;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #000;
      background: #1e1e1e;
    }

    #editor-toolbar {
      background: #333;
      padding: 5px 10px;
      display: flex;
      gap: 10px;
    }

    #file-picker {
      background: #3c3c3c;
      color: white;
      border: 1px solid #555;
      padding: 2px 5px;
      flex-grow: 1;
      cursor: pointer;
    }

    #save-run-btn,
    #stop-btn {
      color: white;
      border: none;
      border-radius: 3px;
      padding: 4px 12px;
      cursor: pointer;
    }

    #save-run-btn {
      background-color: #28a745;
    }

    #stop-btn {
      background-color: #d32f2f;
    }

    #editor-container {
      flex-grow: 1;
      width: 100%;
    }

    /* The output: the canvas above the terminal */
    #right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    #canvas-container {
      flex: 1.5;                /* a bit more space than the terminal */
      position: relative;
      border-bottom: 2px solid #333;
      overflow: hidden;
    }

    #terminal-container {
      flex: 1;
      position: relative;
      background: #000;
    }

    #terminal {
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: 5px;
      right: 5px;
    }

    #drawing-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #close-canvas-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      background-color: rgba(60, 60, 60, 0.8);
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
    }

    #close-canvas-btn:hover {
      background-color: rgba(90, 90, 90, 0.9);
    }

    /* Narrow windows: the editor above the output */
    @media (max-width: 800px) {
      #workspace {
        flex-direction: column;
      }

      #left-panel {
        flex: 0 0 40%;
        border-right: none;
        border-bottom: 2px solid #000;
      }
    }
  </style>
</head>

<body>
  <div id="header">
    <h1>MicroHs Web IDE</h1>
    <div class="button-row">
      <input type="file" id="fallback-picker" webkitdirectory directory multiple style="display: none;">
      <button id="mount-btn">📁 Mount Folder</button>
      <button id="download-url-btn">🌐 GitHub</button>
    </div>
  </div>

  <div id="workspace">
    <div id="left-panel">
      <div id="editor-toolbar">
        <select id="file-picker">
          <option value="">-- Select File --</option>
        </select>
        <button id="new-file-btn">➕ New</button>
        <button id="save-btn">▼ Save</button>
        <button id="save-run-btn">▶ Run</button>
        <button id="stop-btn">⏹ Stop</button>
      </div>
      <div id="editor-container"></div>
    </div>

    <div id="right-panel">
      <div id="canvas-container" style="display: none;">
        <button id="close-canvas-btn" onclick="hideCanvas()">✕</button>
        <canvas id="drawing-canvas"></canvas>
      </div>
      <div id="terminal-container">
        <div id="terminal"></div>
      </div>
    </div>
  </div>

  <script>
    // Files that are put in the home directory at startup.
    const replutils_text = `
module ReplUtils where
import System.Directory
cat :: FilePath -> IO ()
cat f = readFile f >>= putStrLn
ls :: FilePath -> IO ()
ls d = listDirectory d >>= putStrLn . unlines
cd :: FilePath -> IO ()
cd d = setCurrentDirectory d
startUpMessage :: IO ()
startUpMessage = do
  putStrLn ""
  putStrLn "*** MicroHs Web Playground ***"
  putStrLn "Do 'cat \\"line_edit\\"' to see editing commands."
  putStrLn "Try 'import Graphics.CanvHs.Demo' and then run demo1 through demo7."
  putStrLn "To access (read and write) local files, use the 'Mount Folder' button"
  putStrLn "above to select a directory."
  putStrLn ""
`;

    const mhsi_rc_text = `
import ReplUtils
startUpMessage
:set +color
:set prompt=λ\x20
`;

    const line_edit_text = `
Line editing keys (Emacs inspired):
CTL-B         move backwards
CTL-F         move forwards
CTL-A         move to beginning of line
CTL-E         move to end of line
CTL-H         backspace
DEL           backspace
ENTER         send line
CTL-N         next in history
CTL-P         previous in history
CTL-U         erase line
CTL-K         kill to end of line
TAB           complete word
Arrow key     like CTL-B, CTL-F, CTL-P, CTL-N
`;

    const demo_code = `
module Demo where
import Graphics.CanvHs

main :: IO ()
main = display $ Color red $ SolidCircle 50
`;

    const home = '/home/web_user';

    const system_prefix = '\r\n\x1b[32m[System]\x1b[0m ';

    // The canvas, and the mouse state, for Graphics.CanvHs
    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    window.cvs = canvas;
    window.ctx = ctx;
    window.mouseState = { x: 0.0, y: 0.0, down: false };

    window.onload = function () {

      // ---------------- The terminal and the editor

      const term = new Terminal({
        allowProposedApi: true,
        cursorBlink: true,
        rightClickSelectsWord: true,
        fontFamily: 'monospace',
        fontSize: 16,
        theme: {
          background: '#000000',
          red: '#ff5555',
          green: '#50fa7b',
          yellow: '#f1fa8c',
          blue: '#bd93f9',
          cyan: '#8be9fd',
          foreground: '#ffffff'
        }
      });

      const unicode11Addon = new Unicode11Addon.Unicode11Addon();
      term.loadAddon(unicode11Addon);
      term.unicode.activeVersion = '11';

      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById('terminal'));
      fitAddon.fit();

      const editor = ace.edit('editor-container');
      editor.setTheme('ace/theme/monokai');
      editor.session.setMode('ace/mode/haskell');
      editor.setOptions({
        fontSize: '14px',
        fontFamily: "Menlo, Monaco, 'Courier New', monospace",
        wrap: true,
        showPrintMargin: false,
        behavioursEnabled: true     // close brackets and quotes
      });

      const filePicker = document.getElementById('file-picker');

      // ---------------- Running mhs

      // The arguments to mhs come from the URL, e.g., ...?args=-v
      function getUrlArgs() {
        const argsString = new URLSearchParams(window.location.search).get('args');
        if (!argsString) return [];
        return argsString.trim().split(/\s+/);
      }

      // Keep the last 100 lines of the REPL history in the local storage.
      function startHistorySync() {
        setInterval(() => {
          try {
            const historyData = Module.FS.readFile(home + '/.mhsi', { encoding: 'utf8' });
            if (historyData) {
              const last100 = historyData.split('\n').slice(-100).join('\n');
              localStorage.setItem('mhs_history', last100);
            }
          } catch (e) {
            // There is no history file yet
          }
        }, 5000);
      }

      // Output (a byte at a time) from mhs goes to the terminal.
      function termOutput(code) {
        if (code !== null) {
          term.write(code === 10 ? '\r\n' : new Uint8Array([code]));
        }
      }

      window.Module = {
        arguments: getUrlArgs(),
        preRun: [function () {
          // The input comes from sendToMicroHs
          Module.FS.init(() => null, termOutput, termOutput);

          Module.FS.chdir(home);
          Module.FS.writeFile('.mhsi_rc', mhsi_rc_text);
          Module.FS.writeFile('line_edit', line_edit_text);
          Module.FS.writeFile('ReplUtils.hs', replutils_text);
          const demo_path = home + '/Demo.hs';
          Module.FS.writeFile(demo_path, demo_code);

          // Restore the saved command history
          const saved = localStorage.getItem('mhs_history');
          if (saved) {
            try {
              Module.FS.writeFile('.mhsi', saved);
            } catch (e) {}
          }
          startHistorySync();

          editor.setValue(demo_code, -1);
          refreshFileList();
          filePicker.value = demo_path;
        }],
        print: () => {},
        printErr: (text) => term.writeln('Fatal error: ' + text)
      };

      // Send keyboard input to mhs, as UTF-8
      function sendToMicroHs(data) {
        if (window.Module && window.Module._set_input_char) {
          for (const b of new TextEncoder().encode(data)) {
            window.Module._set_input_char(b);
          }
        }
      }

      term.onData(sendToMicroHs);

      // Copy the selected text to the clipboard
      term.onSelectionChange(() => {
        if (term.hasSelection()) {
          navigator.clipboard.writeText(term.getSelection());
        }
      });

      // ---------------- Files

      // Create a directory, and its parents, unless it already exists.
      function safeMkdir(path) {
        try {
          Module.FS.mkdirTree(path);
        } catch (e) {
          // It already exists
        }
      }

      // Put all the files in the home directory in the file picker.
      window.refreshFileList = function () {
        const currentSelection = filePicker.value;

        filePicker.innerHTML = '<option value="">-- Select File --</option>';

        function gatherFiles(dir) {
          Module.FS.readdir(dir).forEach(name => {
            if (name === '.' || name === '..') return;

            const fullPath = dir + '/' + name;
            if (Module.FS.isDir(Module.FS.stat(fullPath).mode)) {
              gatherFiles(fullPath);
            } else {
              const opt = document.createElement('option');
              opt.value = fullPath;
              opt.textContent = fullPath.replace(home + '/', '');
              filePicker.appendChild(opt);
            }
          });
        }

        try {
          try {
            Module.FS.stat(home);
            gatherFiles(home);
          } catch (e) {}

          // Keep the selection, if the file is still there
          if (Array.from(filePicker.options).some(opt => opt.value === currentSelection)) {
            filePicker.value = currentSelection;
          }
        } catch (e) {
          console.error('File list refresh failed:', e);
        }
      };

      filePicker.addEventListener('change', (e) => {
        const fileName = e.target.value;
        if (!fileName) return;

        try {
          editor.setValue(Module.FS.readFile(fileName, { encoding: 'utf8' }), -1);
        } catch (err) {
          term.writeln(system_prefix + `\x1b[31mError reading ${fileName}\x1b[0m`);
        }
      });

      // Write the editor contents to the selected file.  Returns the file, or null.
      function saveCurrentFile() {
        const currentFile = filePicker.value;
        if (!currentFile) {
          alert('Please select a file from the dropdown first!');
          return null;
        }

        try {
          Module.FS.writeFile(currentFile, editor.getValue());
          return currentFile;
        } catch (err) {
          term.writeln(system_prefix + `\x1b[31mFailed to save ${currentFile}\x1b[0m`);
          return null;
        }
      }

      document.getElementById('new-file-btn').addEventListener('click', () => {
        let fileName = prompt('Enter new file name (e.g., Main.hs):');
        if (!fileName) return;
        fileName = fileName.trim();

        safeMkdir(home);
        const fullPath = home + '/' + fileName;

        try {
          Module.FS.writeFile(fullPath, '');
          refreshFileList();

          // A file outside the home directory is not in the list
          if (!Array.from(filePicker.options).some(opt => opt.value === fullPath)) {
            const opt = document.createElement('option');
            opt.value = fullPath;
            opt.textContent = fileName;
            filePicker.appendChild(opt);
          }

          filePicker.value = fullPath;
          editor.setValue('', -1);
        } catch (err) {
          console.error('Failed to create file:', err);
          alert('Failed to create the file. Check the browser console.');
        }
      });

      document.getElementById('save-btn').addEventListener('click', saveCurrentFile);

      // Save the file, and then import it and run main in the REPL
      document.getElementById('save-run-btn').addEventListener('click', () => {
        const currentFile = saveCurrentFile();
        if (!currentFile) return;

        let moduleName = currentFile;
        if (moduleName.startsWith(home + '/')) {
          moduleName = moduleName.slice(home.length + 1);
        }
        moduleName = moduleName.replace(/\.hs$/, '').replace(/\//g, '.');

        // Use the qualified main, since other imported modules may have a main
        sendToMicroHs('import ' + moduleName + '\n');
        sendToMicroHs(moduleName + '.main\n');
      });

      document.getElementById('stop-btn').addEventListener('click', () => {
        sendToMicroHs('\x03');
      });

      // ---------------- Mounting a local folder

      // The mounted files, with their handles, for syncing
      const fileRegistry = {};

      // Copy a local folder into the Wasm file system.
      async function mountDirectory(dirHandle, currentWasmPath) {
        safeMkdir(currentWasmPath);

        for await (const entry of dirHandle.values()) {
          const fullWasmPath = `${currentWasmPath}/${entry.name}`;

          if (entry.kind === 'file') {
            const fileHandle = await dirHandle.getFileHandle(entry.name);
            const file = await fileHandle.getFile();
            Module.FS.writeFile(fullWasmPath, new Uint8Array(await file.arrayBuffer()));

            fileRegistry[fullWasmPath] = {
              handle: fileHandle,
              lastModified: file.lastModified
            };
            console.log(`Mounted: ${fullWasmPath}`);
          } else if (entry.kind === 'directory') {
            const subDirHandle = await dirHandle.getDirectoryHandle(entry.name);
            await mountDirectory(subDirHandle, fullWasmPath);
          }
        }
      }

      function arrayEqual(a, b) {
        if (a.byteLength !== b.byteLength) return false;
        for (let i = 0; i < a.byteLength; i++) {
          if (a[i] !== b[i]) return false;
        }
        return true;
      }

      // Sync the mounted files both ways: a file changed in the Wasm file system
      // is written to the local disk, and a file changed on the local disk is
      // copied to the Wasm file system (and to the editor, if it is shown there).
      async function pollFiles() {
        for (const [path, entry] of Object.entries(fileRegistry)) {
          try {
            const vfsModified = Module.FS.stat(path).mtime.getTime();
            const file = await entry.handle.getFile();

            // Changed in the Wasm file system?
            if (vfsModified > entry.lastModified) {
              const memData = Module.FS.readFile(path);
              const localData = new Uint8Array(await file.arrayBuffer());

              if (!arrayEqual(memData, localData)) {
                const writable = await entry.handle.createWritable();
                await writable.write(memData);
                await writable.close();
                console.log(`Saved to local disk: ${path}`);
              }

              entry.lastModified = vfsModified;
              continue;
            }

            // Changed on the local disk?
            if (file.lastModified > entry.lastModified) {
              const localData = new Uint8Array(await file.arrayBuffer());
              const memData = Module.FS.readFile(path);

              if (!arrayEqual(localData, memData)) {
                Module.FS.writeFile(path, localData);
                console.log(`Auto-synced from local disk: ${path}`);

                if (path === filePicker.value) {
                  const newText = new TextDecoder().decode(localData);
                  const oldMemfsText = new TextDecoder().decode(memData);

                  if (editor.getValue() === oldMemfsText) {
                    // No unsaved changes in the editor, so update it
                    const cursorPos = editor.getCursorPosition();
                    editor.session.setValue(newText);
                    editor.moveCursorToPosition(cursorPos);
                  } else {
                    // Don't overwrite what the user is editing
                    term.writeln(system_prefix + `Conflict on ${path}: File changed on disk, but you have unsaved changes in the editor!`);
                  }
                }
              }

              entry.lastModified = file.lastModified;
            }
          } catch (e) {
            // Probably a permission error
          }
        }
      }

      document.getElementById('mount-btn').addEventListener('click', async () => {
        if (window.showDirectoryPicker) {
          try {
            const rootDirHandle = await window.showDirectoryPicker();
            const targetPath = home + `/${rootDirHandle.name}`;

            term.writeln(system_prefix + `Mounting directory into ${targetPath}...`);
            await mountDirectory(rootDirHandle, targetPath);
            term.writeln(system_prefix + 'Workspace mounted successfully.');

            if (!window.syncInterval) window.syncInterval = setInterval(pollFiles, 500);
            refreshFileList();
          } catch (err) {
            term.writeln(system_prefix + 'Mount failed or cancelled.');
          }
        } else {
          // No File System Access API, so just copy the files
          document.getElementById('fallback-picker').click();
        }
      });

      document.getElementById('fallback-picker').addEventListener('change', async (e) => {
        const files = e.target.files;
        if (files.length === 0) return;

        term.writeln(system_prefix + `Uploading ${files.length} files to virtual RAM disk...`);

        for (const file of files) {
          const fullPath = home + '/' + file.webkitRelativePath;   // e.g., folder/sub/File.hs
          safeMkdir(fullPath.substring(0, fullPath.lastIndexOf('/')));
          Module.FS.writeFile(fullPath, new Uint8Array(await file.arrayBuffer()));
        }

        term.writeln(system_prefix + 'Workspace loaded (RAM only, no Live Sync).');
        refreshFileList();
      });

      // ---------------- Downloading a folder from GitHub

      document.getElementById('download-url-btn').addEventListener('click', async () => {
        const defaultUrl = 'https://github.com/augustss/canvhs/tree/main/';
        const rawUrl = prompt('Enter GitHub Folder URL:', defaultUrl);
        if (!rawUrl) return;

        try {
          const urlMatch = rawUrl.match(/github\.com\/([^/]+)\/([^/]+)\/tree\/([^/]+)\/?(.*)/);
          if (!urlMatch) throw new Error('Invalid format. Use: github.com/user/repo/tree/branch/path');

          const [, user, repo, branch, targetPath] = urlMatch;
          const apiUrl = `https://api.github.com/repos/${user}/${repo}/git/trees/${branch}?recursive=1`;

          term.writeln(system_prefix + `\x1b[36mScanning ${user}/${repo} (${branch})...\x1b[0m`);
          const response = await fetch(apiUrl);
          const data = await response.json();

          if (!data.tree) throw new Error('Could not find repository tree. Check branch name.');

          // Everything under the path, which may be empty
          const itemsToDownload = data.tree.filter(item =>
            targetPath === '' || item.path.startsWith(targetPath)
          );

          // The files go in a directory named after the repository
          const baseDir = repo;
          safeMkdir(baseDir);

          for (const item of itemsToDownload) {
            let relativePath = item.path;
            if (targetPath !== '') {
              relativePath = item.path.replace(targetPath, '').replace(/^\//, '');
            }
            if (!relativePath) continue;

            const fullWasmPath = `${baseDir}/${relativePath}`;

            if (item.type === 'tree') {
              safeMkdir(fullWasmPath);
            } else if (item.type === 'blob') {
              const downloadUrl = `https://raw.githubusercontent.com/${user}/${repo}/${branch}/${item.path}`;
              const fileRes = await fetch(downloadUrl);

              if (fileRes.ok) {
                const blob = await fileRes.arrayBuffer();
                const dirPath = fullWasmPath.substring(0, fullWasmPath.lastIndexOf('/'));
                if (dirPath) safeMkdir(dirPath);
                Module.FS.writeFile(fullWasmPath, new Uint8Array(blob));
              }
            }
          }

          term.writeln(system_prefix + '\x1b[32mDownload Complete!\x1b[0m');
          refreshFileList();
        } catch (error) {
          term.writeln(system_prefix + `\x1b[31mError: ${error.message}\x1b[0m`);
        }
      });

      // ---------------- The canvas

      // Make the canvas resolution match its size on the screen.
      function resizeCanvas() {
        const container = document.getElementById('canvas-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
      }

      resizeCanvas();

      window.addEventListener('resize', () => {
        fitAddon.fit();
        resizeCanvas();
      });

      window.showCanvas = function () {
        const container = document.getElementById('canvas-container');
        if (container.style.display !== 'block') {
          container.style.display = 'block';
          resizeCanvas();
          fitAddon.fit();       // the terminal is now smaller
        }
      };

      window.hideCanvas = function () {
        document.getElementById('canvas-container').style.display = 'none';
        fitAddon.fit();         // the terminal is now bigger
      };

      // The mouse position, with the origin in the center, and the y axis up
      function updateMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        window.mouseState.x = (e.clientX - rect.left) - (rect.width / 2);
        window.mouseState.y = (rect.height / 2) - (e.clientY - rect.top);
      }

      canvas.addEventListener('mousemove', updateMousePos);

      canvas.addEventListener('mousedown', (e) => {
        updateMousePos(e);
        window.mouseState.down = true;
      });

      canvas.addEventListener('mouseup', (e) => {
        updateMousePos(e);
        window.mouseState.down = false;
      });

      // Draw text at the current position, but not scaled, flipped, or rotated.
      window.drawHaskellText = function (textPtr) {
        const str = UTF8ToString(textPtr);
        const matrix = ctx.getTransform();

        ctx.save();
        ctx.resetTransform();
        if (ctx.font !== '24px monospace') {      // setting the font is slow
          ctx.font = '24px monospace';
        }
        ctx.textBaseline = 'middle';
        ctx.fillText(str, Math.round(matrix.e), Math.round(matrix.f));
        ctx.restore();
      };

      // ---------------- Start mhs

      const script = document.createElement('script');
      script.src = 'mhs-embed.js';
      document.body.appendChild(script);
    };

    // ---------------- Audio, for Graphics.CanvHs

    // The audio nodes are referred to by their index; index 0 is the speakers.
    window.audioCtx = null;
    window.audioNodes = [];

    window.js_initAudio = function () {
      if (!window.audioCtx) {
        window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        window.audioNodes = [window.audioCtx.destination];
      }
      if (window.audioCtx.state === 'suspended') {
        window.audioCtx.resume();
      }
    };

    window.js_currentTime = function () {
      return window.audioCtx.currentTime;
    };

    window.js_createOscillator = function (waveType) {
      const osc = window.audioCtx.createOscillator();
      osc.type = ['sine', 'square', 'sawtooth', 'triangle'][waveType];
      window.audioNodes.push(osc);
      return window.audioNodes.length - 1;
    };

    window.js_createGain = function () {
      window.audioNodes.push(window.audioCtx.createGain());
      return window.audioNodes.length - 1;
    };

    window.js_connect = function (sourceId, targetId) {
      window.audioNodes[sourceId].connect(window.audioNodes[targetId]);
    };

    window.js_setFrequency = function (id, freq, time) {
      window.audioNodes[id].frequency.setValueAtTime(freq, time);
    };

    window.js_setGain = function (id, vol, time) {
      window.audioNodes[id].gain.setValueAtTime(vol, time);
    };

    window.js_rampGain = function (id, vol, time) {
      window.audioNodes[id].gain.exponentialRampToValueAtTime(vol, time);
    };

    window.js_startNode = function (id, time) {
      window.audioNodes[id].start(time);
    };

    window.js_stopNode = function (id, time) {
      window.audioNodes[id].stop(time);
    };
  </script>
