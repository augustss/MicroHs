name: MicroHs Nightly
# Compile on all architectures only nightly.

on:
  schedule:
    - cron: '23 4 * * *'  # Every day at 04:23 UTC
  workflow_dispatch:

jobs:
  build-linux-gmp-x86_64:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - name: install GMP (headers + libs)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev
    - name: make
      run: make MHSGMPCCFLAGS=-DWANT_GMP=1 MCABALGMP=-fgmp MHSGMP=-ilib/gmp MHSGMPCCLIBS=-lgmp
    - name: make everytestmhs
      run: make MHSGMPCCFLAGS=-DWANT_GMP=1 MCABALGMP=-fgmp MHSGMP=-ilib/gmp MHSGMPCCLIBS=-lgmp everytestmhs
    - name: make install
      run: make MHSGMPCCFLAGS=-DWANT_GMP=1 MCABALGMP=-fgmp MHSGMP=-ilib/gmp MHSGMPCCLIBS=-lgmp minstall

  build-macos:
    runs-on: macos-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - name: make
      run: make
    - name: make everytestmhs
      run: make everytestmhs

  build-linux-x86_64-cabal:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - name: Cabal cache
      uses: actions/cache@v3
      env:
        cache-name: cache-cabal
      with:
        path: ~/.cabal
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-
    - name: Install dependencies
      run: |
        cabal update
        cabal build --only-dependencies
    - name: Build
      run: cabal build

  build-linux-micro-x86_64:
    runs-on: ubuntu-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - name: make
      run: make CONF=micro

  build-windows:
    runs-on: windows-latest
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - name: set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: nmake
      run: nmake -f Makefile.windows
    - name: nmake exampletest
      run: nmake -f Makefile.windows exampletest

  build-linux-misc:
    runs-on: ubuntu-22.04          # traditional sudo
    strategy:
      matrix:
        arch:
          - aarch64
          - armv7
          - ppc64le
          - riscv64
          - s390x
          - x86
          - x86_64
    steps:
    - name: checkout repo
      uses: actions/checkout@v4
    - name: Setup Alpine (${{ matrix.arch }})
      uses: jirutka/setup-alpine@v1
      with:
        arch: ${{ matrix.arch }}
        branch: v3.20   # avoid database format change
        packages: >
          build-base
          gcc
          make
    - name: make install
      run: make install
      shell: alpine.sh {0}
    - name: make everytestmhs
      run: make everytestmhs
      shell: alpine.sh {0}

  build-emscripten:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: mymindstorm/setup-emsdk@v13
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: haskell-actions/setup@v2
    - name: make newmhs
      run: make newmhs
    - name: run emscripten tests
      run: make runtestemscripten


  # Build packages on a 64 bit big endian platform
  build-hackage-x86:
    runs-on: ubuntu-22.04          # traditional sudo
    steps:
    # mhs
    - uses: jirutka/setup-alpine@v1
      with:
        arch: s390x
        packages: >
          build-base
          gcc
          make
          curl
          git

    - name: checkout mhs repo
      uses: actions/checkout@v4
      with:
        path: mhs
    - name: make and install mhs
      run: |
        cd mhs
        make minstall
        echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"
      shell: alpine.sh {0}

    # Build hackage packages
    - name: compile and install packages
      run: |
        cd mhs
        make -f Makefile.packages
      shell: alpine.sh {0}

    # DONE
    - name: cleanup
      run: |
        rm -rf $HOME/.mcabal
